<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Story World</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="brand">📖 Story World <span id="story-title" class="muted"></span></div>
    <nav id="tabs">
      <button data-tab="world">1 · World</button>
      <button data-tab="characters">2 · Characters</button>
      <button data-tab="scripts">3 · Scripts</button>
      <button data-tab="play">4 · Play</button>
    </nav>
    <div class="actions">
      <button id="export-btn" class="ghost">Export</button>
      <label class="ghost button">Import<input id="import-input" type="file" accept="application/json" hidden /></label>
      <button id="reset-btn" class="ghost">New</button>
    </div>
  </header>
  <main>
    <section id="view-world" class="view"></section>
    <section id="view-characters" class="view"></section>
    <section id="view-scripts" class="view"></section>
    <section id="view-play" class="view"></section>
  </main>
  <div id="toast"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
